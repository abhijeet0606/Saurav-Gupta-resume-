<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saurav Gupta | Finance & Business Analytics Portfolio</title>
  <meta name="description" content="Portfolio & Resume of Saurav Gupta - PGDM Student at IMDR Pune, Aspiring Finance & Business Analytics Professional.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(18, 26, 43, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.12);
      --accent-border: rgba(56, 189, 248, 0.28);
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 2.5rem 1rem;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(56, 189, 248, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(129, 140, 248, 0.08) 0%, transparent 40%);
      background-attachment: fixed;
    }
    .container {
      max-width: 960px;
      margin: 0 auto;
    }
    /* Nav */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 0.85rem 1.5rem;
      margin-bottom: 2rem;
    }
    .nav-brand {
      font-weight: 800;
      font-size: 1.1rem;
      color: #fff;
      text-decoration: none;
      letter-spacing: 0.05em;
    }
    .nav-brand span {
      color: var(--accent);
    }
    .nav-links {
      display: flex;
      gap: 1.25rem;
    }
    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 500;
      transition: color 0.2s;
    }
    .nav-links a:hover {
      color: var(--accent);
    }
    @media (max-width: 600px) {
      .nav-links {
        display: none;
      }
    }

    /* Header */
    header {
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 2.5rem 2rem;
      margin-bottom: 2rem;
      box-shadow: 0 15px 35px rgba(0,0,0,0.3);
